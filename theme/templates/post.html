{% extends "base.html" %}
{% block title %}{{ title }} · {{ site.title }}{% endblock %}
{% block content %}
{% include "_backlink.html" %}
<header class="hero-header">
  <h1 class="post-title">{{ title }}</h1>
  <p class="post-meta">{{ dateDisplay }}</p>
</header>
<article class="post">
  {{ content_html }}
  {% if tag_links %}<div class="post-tags">{% for t in tag_links %}<a href="{{ t.url }}">{{ t.name }}</a>{% endfor %}</div>{% endif %}
</article>
{% endblock %}
