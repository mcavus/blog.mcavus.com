<ul class="post-list">
{% for post in posts %}
  <li class="post-item">
    <div class="post-date">{{ post.dateDisplay }}{% if post.draft %} <span class="draft-tag">Draft</span>{% endif %}</div>
    <h2 class="post-item-title"><a href="{{ post.url }}">{{ post.title }}</a></h2>
    {# Arrow is markup so it survives without JS; post-list.js adds the ellipsis. #}
    {% if post.excerpt %}<p class="post-excerpt">{{ post.excerpt }}<span class="excerpt-cue"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
      <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
    </svg></span></p>{% endif %}
  </li>
{% endfor %}
</ul>
